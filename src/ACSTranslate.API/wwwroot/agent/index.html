<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Interface</title>
    <link rel="stylesheet" href="/public/style.css">
</head>

<body>
    <header>Real-Time Call Translation - Agent Interface
        <button id="enableAudio" style="display: none; margin-left: auto;">Enable Audio</button>
    </header>
    <main>
        <aside id="callsPane" aria-label="Inbound Calls">
            <button id="disconnect" class="disconnect">Disconnect</button>
            <h2>Inbound Calls</h2>
            <div class="call-list" id="callList">
            </div>
        </aside>
        <section id="centerPane">
            <form id="configPanel" autocomplete="off">
                <div class="field">
                    <label for="callerLang">Caller Language</label>
                    <select id="callerLang">
                        <option value="loading">Loading...</option>
                    </select>
                </div>
                <div class="field">
                    <label for="agentLang">Agent Language</label>
                    <select id="agentLang">
                        <option value="loading">Loading...</option>
                    </select>
                </div>

                <div class="field" id="translatorModeField" style="display:none">
                    <label>Translator</label>
                    <input type="hidden" id="translatorMode" value="">
                    <div class="toggle-switch" id="translatorToggle">
                        <span class="toggle-label toggle-left" id="toggleLabelLeft">AISpeech</span>
                        <div class="toggle-track" id="toggleTrack">
                            <div class="toggle-thumb" id="toggleThumb"></div>
                        </div>
                        <span class="toggle-label toggle-right" id="toggleLabelRight">VoiceLive</span>
                    </div>
                </div>

                <fieldset class="audio-options">
                    <legend>Audio Options</legend>
                    <div class="field">
                        <label for="callerOrigChan">Caller Original Audio</label>
                        <input type="checkbox" id="callerOrigChan">
                    </div>
                    <div class="field">
                        <label for="callerTransChan">Caller Translated Audio</label>
                        <input type="checkbox" id="callerTransChan" checked>
                    </div>
                    <div class="field">
                        <label for="agentOrigChan">Agent Original Audio</label>
                        <input type="checkbox" id="agentOrigChan" disabled>
                    </div>
                    <div class="field">
                        <label for="agentTransChan">Agent Translated Audio</label>
                        <input type="checkbox" id="agentTransChan">
                    </div>
                </fieldset>
            </form>
            <div id="transcriptContainer" aria-label="Transcript Log">
                <div id="transcriptHeader">
                    <div>Time</div>
                    <div>Speaker</div>
                    <div>Agent Language</div>
                    <div>Caller Language</div>
                </div>
                <div id="transcript">
                    <div class="empty-hint" id="transcriptEmpty">
                        No transcript yet. Connected conversation turns will appear here.</div>
                </div>
                <div class="status-bar" id="statusBar">
                    <span id="status">Loading...</span>
                </div>
            </div>
        </section>
    </main>

    <script src="/public/helper.js"></script>
    <script>
        // Check for ACS waiting calls periodically
        const authCode = new URLSearchParams(window.location.search).get("code");
        let socket = null; // Declare socket in outer scope so ACS handlers can access it
        
        async function checkACSCalls() {
            try {
                const response = await fetch('/api/calls/waiting?code=' + encodeURIComponent(authCode || ''));
                if (response.ok) {
                    const calls = await response.json();
                    updateACSCallsList(calls);
                }
            } catch (error) {
                console.error('Failed to fetch ACS calls:', error);
            }
        }
        
        function updateACSCallsList(calls) {
            const callList = document.getElementById('callList');
            const existingACSCalls = callList.querySelectorAll('.acs-call');
            
            // Remove old ACS calls that are NOT currently ongoing
            existingACSCalls.forEach(el => {
                if (el.dataset.ongoing === 'true') return; // keep ongoing calls
                el.remove();
            });
            
            // Add new ACS calls at the top (skip if already shown as ongoing)
            if (calls && calls.length > 0) {
                calls.forEach(call => {
                    if (document.getElementById('call-' + call.id)) return; // already in list
                    const callDiv = document.createElement('div');
                    callDiv.className = 'call-item acs-call';
                    callDiv.id = 'call-' + call.id;
                    callDiv.innerHTML = `
                        <div class="call-id">📞 ACS Call</div>
                        <div class="call-meta">
                            From: ${call.callerId}<br>
                            Language: ${call.userLanguage}<br>
                            Received: ${new Date(call.callReceived).toLocaleTimeString()}
                        </div>
                        <button type="button" class="acs-connect-btn" data-call-id="${call.id}">
                            Connect
                        </button>
                    `;
                    
                    // Add click handler for connect button
                    const connectBtn = callDiv.querySelector('.acs-connect-btn');
                    connectBtn.onclick = (e) => {
                        const callId = e.target.dataset.callId;
                        e.target.innerText = "Connecting...";
                        e.target.disabled = true;
                        
                        if (callId && socket?.readyState === WebSocket.OPEN) {
                            const userLanguage = document.getElementById("callerLang").value;
                            const agentLanguage = document.getElementById("agentLang").value;
                            socket.send(JSON.stringify({
                                type: "connect",
                                callId: callId,
                                options: {
                                    UserLanguage: userLanguage,
                                    AgentLanguage: agentLanguage,
                                    TranslatorMode: document.getElementById("translatorMode").value || null,
                                    AgentAudioOptions: {
                                        UserOriginalAudio: document.getElementById("callerOrigChan").checked,
                                        UserTranslatedAudio: document.getElementById("callerTransChan").checked,
                                        AgentOriginalAudio: document.getElementById("agentOrigChan").checked,
                                        AgentTranslatedAudio: document.getElementById("agentTransChan").checked
                                    }
                                }
                            }));
                        }
                    };
                    
                    callList.insertBefore(callDiv, callList.firstChild);
                });
            }
        }
        
        // Start checking for ACS calls
        checkACSCalls();
        setInterval(checkACSCalls, 5000); // Check every 5 seconds
        
        (async () => {
            const newTranscriptRow = (role) => {
                const row = document.createElement("div");
                row.className = "trans-row " + role;
                row.style.display = "none";

                const timeDiv = document.createElement("div");
                timeDiv.className = "time";
                const now = new Date();
                timeDiv.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                row.appendChild(timeDiv);

                const roleDiv = document.createElement("div");
                roleDiv.className = "role";
                roleDiv.innerText = (role === "agent" ? "Agent" : "Caller");
                row.appendChild(roleDiv);


                const translatedDiv = document.createElement("div");
                translatedDiv.className = "translated";
                translatedDiv.innerText = "";
                row.appendChild(translatedDiv);

                const originalDiv = document.createElement("div");
                originalDiv.className = "original";
                originalDiv.innerText = "";
                row.appendChild(originalDiv);

                return row;
            };



            const statusText = document.getElementById("status");
            let audioEnabled = false;
            // socket is now declared in outer scope

            // Configure audio
            statusText.innerText = "Setting up audio...";
            const sampleRate = 16000;
            const voiceAgentNode = await setupAudioWorklet(sampleRate, (data) => {
                if (audioEnabled && socket?.readyState === WebSocket.OPEN && data?.length > 0) {
                    socket.send(JSON.stringify({
                        type: "audio",
                        data: btoa(String.fromCharCode(...data))
                    }));
                }
            });

            if (!voiceAgentNode) {
                document.body.innerHTML = "<h1>Audio setup failed</h1><p>Please allow microphone access and refresh the page. (Details are in console)</p>";
                return;
            }

            // Disconnect button with easy refresh
            const disconnectButton = document.getElementById("disconnect");
            disconnectButton.addEventListener("click", (e) => {
                if (socket?.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "disconnect" }));
                }
            });
            disconnectButton.addEventListener("dblclick", (e) => {
                refresh();
            });

            // Audio config buttons
            const sendAudioOptionsUpdate = () => {
                if (socket?.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "audioOptions",
                        options: {
                            UserOriginalAudio: document.getElementById("callerOrigChan").checked,
                            UserTranslatedAudio: document.getElementById("callerTransChan").checked,
                            AgentOriginalAudio: document.getElementById("agentOrigChan").checked,
                            AgentTranslatedAudio: document.getElementById("agentTransChan").checked
                        }
                    }));
                }
            };
            document.getElementById("callerOrigChan").addEventListener("change", sendAudioOptionsUpdate);
            document.getElementById("callerTransChan").addEventListener("change", sendAudioOptionsUpdate);
            document.getElementById("agentOrigChan").addEventListener("change", sendAudioOptionsUpdate);
            document.getElementById("agentTransChan").addEventListener("change", sendAudioOptionsUpdate);

            // Finally connect our socket
            const refresh = () => location.reload();
            const authCode = new URLSearchParams(window.location.search).get("code");
            statusText.innerText = "Connecting to server...";
            socket = new WebSocket("/api/agent/ws?code=" + encodeURIComponent(authCode || ""));
            socket.onclose = (event) => {
                console.log("WebSocket closed:", event);
                setTimeout(refresh, 1000);
            };
            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                socket.close();
            };
            socket.onopen = (event) => {
                console.log("WebSocket opened:", event);
                statusText.innerText = "Connected.";
            };
            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === "refresh") refresh();
                else if (message.type === "ping") { }
                else if (message.type === "enable") {
                    audioEnabled = true;
                    document.getElementById("transcript").innerHTML = "";
                }
                else if (message.type === "disconnect") {
                    audioEnabled = false;
                    console.log("Disconnected by server");
                }
                else if (message.type === "languages") {
                    const fillLanguages = (id, languages, selected = "") => {
                        //{en-US: 'English', de-DE: 'German', fr-FR: 'French', es-MX: 'Spanish (Mexico)', ar-SA: 'Arabic', …}
                        const select = document.getElementById(id);
                        const codes = Object.keys(languages);

                        if (codes.length === 0) return;
                        select.innerHTML = "";

                        for (const code of codes) {
                            const option = document.createElement("option");
                            option.value = code;
                            option.innerText = `${languages[code]}`;
                            if (code === selected) option.selected = true;
                            select.appendChild(option);
                        }
                    }
                    // Populate language selectors
                    fillLanguages("callerLang", message.languages, "es-MX");
                    fillLanguages("agentLang", message.languages, "en-US");
                }
                else if (message.type === "translatorModes") {
                    const field = document.getElementById("translatorModeField");
                    const hiddenInput = document.getElementById("translatorMode");
                    const track = document.getElementById("toggleTrack");
                    const thumb = document.getElementById("toggleThumb");
                    const labelLeft = document.getElementById("toggleLabelLeft");
                    const labelRight = document.getElementById("toggleLabelRight");

                    if (message.modes && message.modes.length > 1) {
                        labelLeft.textContent = message.modes[0];
                        labelRight.textContent = message.modes[1];
                        const isRight = message.defaultMode === message.modes[1];
                        hiddenInput.value = message.defaultMode;
                        thumb.classList.toggle("active", isRight);
                        labelLeft.classList.toggle("selected", !isRight);
                        labelRight.classList.toggle("selected", isRight);

                        track.onclick = () => {
                            const nowRight = thumb.classList.toggle("active");
                            hiddenInput.value = nowRight ? message.modes[1] : message.modes[0];
                            labelLeft.classList.toggle("selected", !nowRight);
                            labelRight.classList.toggle("selected", nowRight);
                        };
                        field.style.display = "";
                    } else {
                        hiddenInput.value = (message.modes && message.modes[0]) || "";
                        field.style.display = "none";
                    }
                }
                else if (message.type === "transcription") {
                    const transcript = document.getElementById("transcript");
                    if (!transcript.querySelector(".agent") ||
                        !transcript.querySelector(".user")) {
                        transcript.innerHTML = "";
                        transcript.appendChild(newTranscriptRow("agent"));
                        transcript.appendChild(newTranscriptRow("user"));
                    }

                    const agentRows = transcript.querySelectorAll(".agent");
                    const lastAgentRow = agentRows[agentRows.length - 1];
                    const userRows = transcript.querySelectorAll(".user");
                    const lastUserRow = userRows[userRows.length - 1];

                    if (message.source === "agent") {
                        lastAgentRow.style.display = null;
                        // Quick fix to always show Agent language on left
                        lastAgentRow.querySelector(".translated").innerText = message.originalText;
                        lastAgentRow.querySelector(".original").innerText = message.translatedText;
                        if (message.isFinal) {
                            transcript.appendChild(newTranscriptRow("agent"));
                        }
                    } else if (message.source === "user") {
                        lastUserRow.style.display = null;
                        lastUserRow.querySelector(".original").innerText = message.originalText;
                        lastUserRow.querySelector(".translated").innerText = message.translatedText;
                        if (message.isFinal) {
                            transcript.appendChild(newTranscriptRow("user"));
                        }
                    }
                    transcript.scrollTop = transcript.scrollHeight;
                }
                else if (message.type == "update") {
                    for (const callUpdate of (message.updates || [])) {
                        const newCallState = callUpdate?.state?.toLowerCase();
                        // Update calls
                        const callBoxId = "call-" + callUpdate.id;
                        const callMetaId = "callMeta-" + callUpdate.id;
                        const callButtonId = "callButton-" + callUpdate.id;

                        const callBox = document.getElementById(callBoxId);

                        if (newCallState == "disconnected") {
                            if (callBox) callBox.remove();
                            continue;
                        }

                        if (!callBox) {
                            const newCallBoxDiv = document.createElement('div');
                            newCallBoxDiv.id = callBoxId;
                            newCallBoxDiv.className = 'call-item';

                            const newCallBoxTitleDiv = document.createElement('div');
                            newCallBoxTitleDiv.className = 'call-id';
                            newCallBoxTitleDiv.innerText = `Call #${callUpdate.id.substring(0, 8)}`;
                            newCallBoxDiv.appendChild(newCallBoxTitleDiv);

                            const newCallBoxMetaDiv = document.createElement('div');
                            newCallBoxMetaDiv.className = 'call-meta';
                            newCallBoxMetaDiv.id = callMetaId;
                            newCallBoxDiv.appendChild(newCallBoxMetaDiv);

                            const newCallBoxButton = document.createElement('button');
                            newCallBoxButton.type = 'button';
                            newCallBoxButton.id = callButtonId;
                            newCallBoxButton.dataset.connect = callUpdate.id;
                            newCallBoxButton.innerText = 'Connect';
                            newCallBoxButton.onclick = (e) => {
                                const callId = e.target?.dataset?.connect;
                                e.target.innerText = "Connecting...";
                                e.target.disabled = true;
                                if (callId && socket?.readyState === WebSocket.OPEN) {
                                    const userLanguage = document.getElementById("callerLang").value;
                                    const agentLanguage = document.getElementById("agentLang").value;
                                    socket.send(JSON.stringify({
                                        type: "connect",
                                        callId: callId,
                                        options: {
                                            UserLanguage: userLanguage,
                                            AgentLanguage: agentLanguage,
                                            TranslatorMode: document.getElementById("translatorMode").value || null,
                                            AgentAudioOptions: {
                                                UserOriginalAudio: document.getElementById("callerOrigChan").checked,
                                                UserTranslatedAudio: document.getElementById("callerTransChan").checked,
                                                AgentOriginalAudio: document.getElementById("agentOrigChan").checked,
                                                AgentTranslatedAudio: document.getElementById("agentTransChan").checked
                                            }
                                        }
                                    }));
                                }
                            };
                            newCallBoxDiv.appendChild(newCallBoxButton);

                            const callList = document.getElementById('callList');
                            callList.appendChild(newCallBoxDiv);
                        }

                        const callMeta = document.getElementById(callMetaId);
                        if (callMeta) callMeta.innerText = callUpdate?.state;

                        const callButton = document.getElementById(callButtonId);
                        if (callButton) callButton.style.display = (newCallState === "userconnected" ? 'block' : 'none');
                    }
                } else if (message.type === "audio") {
                    // Play audio
                    voiceAgentNode.port.postMessage(atobInt16(message.data));
                } else if (message.type === "acsCallConnected") {
                    // ACS call connected — mark in UI as ongoing and enable audio
                    audioEnabled = true;
                    document.getElementById("transcript").innerHTML = "";
                    const callBox = document.getElementById("call-" + message.callId);
                    if (callBox) {
                        callBox.dataset.ongoing = 'true';
                        callBox.classList.add('ongoing');
                        const btn = callBox.querySelector('.acs-connect-btn');
                        if (btn) { btn.innerText = "Ongoing"; btn.disabled = true; btn.classList.add('ongoing-btn'); }
                        const meta = callBox.querySelector('.call-meta');
                        if (meta) { meta.innerHTML += '<br><strong>Status: Ongoing</strong>'; }
                    }
                    statusText.innerText = "ACS call connected — translating...";
                    console.log("ACS call connected:", message.callId);
                } else if (message.type === "acsCallDisconnected") {
                    // ACS call ended
                    audioEnabled = false;
                    const callBox = document.getElementById("call-" + message.callId);
                    if (callBox) callBox.remove();
                    statusText.innerText = "ACS call ended.";
                    console.log("ACS call disconnected:", message.callId);
                } else {
                    console.warn("Unknown message type:", message);
                }
            };
        })();
    </script>
</body>

</html>
