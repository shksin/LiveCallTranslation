<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Interface</title>
    <link rel="stylesheet" href="/public/style.css">
</head>

<body>
    <header>Real-Time Call Translation - User Dial-in</header>
    <button id="enableAudio" style="display: none;">Enable Audio</button>
    <p id="status"></p>
    <script src="/public/helper.js"></script>
    <script>
        (async () => {
            const statusText = document.getElementById("status");
            let audioEnabled = false;
            let socket = null;

            // Configure audio
            statusText.innerText = "Setting up audio...";
            const sampleRate = 16000;
            const voiceAgentNode = await setupAudioWorklet(sampleRate, (data) => {
                if (audioEnabled && socket?.readyState === WebSocket.OPEN && data?.length > 0) {
                    socket.send(JSON.stringify({
                        type: "audio",
                        data: btoa(String.fromCharCode(...data))
                    }));
                }
            });

            if (!voiceAgentNode) {
                document.body.innerHTML = "<h1>Audio setup failed</h1><p>Please allow microphone access and refresh the page. (Details are in console)</p>";
                return;
            }

            // Finally connect our socket
            const refresh = () => location.reload();
            const authCode = new URLSearchParams(window.location.search).get("code");
            statusText.innerText = "Connecting to server...";
            socket = new WebSocket("/api/user/ws?code=" + encodeURIComponent(authCode || ""));
            socket.onclose = (event) => {
                console.log("WebSocket closed:", event);
                setTimeout(refresh, 1000);
            };
            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                socket.close();
            };
            socket.onopen = (event) => {
                console.log("WebSocket opened:", event);
                statusText.innerText = "Connected. Waiting for agent...";
            };
            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === "refresh" || message.type === "disconnect") refresh();
                else if (message.type === "ping") {}
                else if (message.type === "enable") {
                    // Enable the microphone
                    audioEnabled = true;
                    statusText.innerText = "Speaking with agent...";
                } else if (message.type === "audio") {
                    // Play audio
                    voiceAgentNode.port.postMessage(atobInt16(message.data));
                } else {
                    console.warn("Unknown message type:", message);
                }
            };
        })();
    </script>
</body>

</html>
