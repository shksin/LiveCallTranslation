<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Interface</title>
    <link rel="stylesheet" href="/public/style.css">
    <style>
        .mode-selector {
            margin: 20px auto;
            max-width: 900px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .mode-selector h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #333;
        }
        .mode-options {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .mode-option {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-option:hover {
            border-color: #007bff;
        }
        .mode-option.selected {
            border-color: #007bff;
            background: #e7f3ff;
        }
        .mode-option h3 {
            margin: 0 0 8px 0;
            font-size: 1.1em;
            color: #222;
        }
        .mode-option p {
            margin: 0;
            font-size: 0.9em;
            color: #555;
        }
        .acs-info {
            margin-top: 15px;
            padding: 12px;
            background: #fff3cd;
            border-radius: 4px;
            display: none;
        }
        .acs-info.visible {
            display: block;
        }
        .acs-info.error {
            background: #f8d7da;
            color: #721c24;
        }
        .acs-info.success {
            background: #d4edda;
            color: #155724;
        }
        #connectBtn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1em;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #connectBtn:hover {
            background: #0056b3;
        }
        #connectBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <header>Real-Time Call Translation - User Dial-in</header>
    <button id="enableAudio" style="display: none;">Enable Audio</button>
    
    <div class="mode-selector" id="modeSelector">
        <h2>Select Connection Mode</h2>
        <div class="mode-options">
            <div class="mode-option" id="modeDefault" onclick="selectMode('default')">
                <h3>🌐 Default (Browser)</h3>
                <p>Connect directly via browser. No phone required.</p>
            </div>
            <div class="mode-option" id="modeACS" onclick="selectMode('acs')">
                <h3>📞 ACS (Phone)</h3>
                <p>Call via Azure Communication Services phone number.</p>
            </div>
        </div>
        <div class="acs-info" id="acsInfo"></div>
        
        <button id="connectBtn" onclick="connect()" disabled>Connect</button>
    </div>
    
    <p id="status" style="display: none;"></p>
    <script src="/public/helper.js"></script>
    <script>
        let selectedMode = null;
        const authCode = new URLSearchParams(window.location.search).get("code");

        function selectMode(mode) {
            selectedMode = mode;
            document.getElementById('modeDefault').classList.remove('selected');
            document.getElementById('modeACS').classList.remove('selected');
            document.getElementById(mode === 'acs' ? 'modeACS' : 'modeDefault').classList.add('selected');
            
            const acsInfo = document.getElementById('acsInfo');
            const connectBtn = document.getElementById('connectBtn');
            
            // Reset panels
            acsInfo.classList.remove('visible');
            connectBtn.style.display = 'block';
            connectBtn.disabled = true;

            if (mode === 'acs') {
                acsInfo.className = 'acs-info success visible';
                acsInfo.innerHTML = '<strong>📞 Speak to an agent by calling</strong><br><span style="font-size: 1.5em; font-weight: bold;">+61-SUPPORT-CONTACT</span>';
                connectBtn.style.display = 'none';
            } else {
                connectBtn.disabled = false;
            }
        }

        async function connect() {
            if (!selectedMode || selectedMode !== 'default') return;
            
            document.getElementById('modeSelector').style.display = 'none';
            const statusText = document.getElementById('status');
            statusText.style.display = 'block';
            
            await connectDefault();
        }

        async function connectDefault() {
            const statusText = document.getElementById('status');
            let audioEnabled = false;
            let socket = null;

            statusText.innerText = "Setting up audio...";
            const sampleRate = 16000;
            const voiceAgentNode = await setupAudioWorklet(sampleRate, (data) => {
                if (audioEnabled && socket?.readyState === WebSocket.OPEN && data?.length > 0) {
                    socket.send(JSON.stringify({
                        type: "audio",
                        data: btoa(String.fromCharCode(...data))
                    }));
                }
            });

            if (!voiceAgentNode) {
                document.body.innerHTML = "<h1>Audio setup failed</h1><p>Please allow microphone access and refresh the page.</p>";
                return;
            }

            const refresh = () => location.reload();
            statusText.innerText = "Connecting to server...";
            socket = new WebSocket("/api/user/ws?code=" + encodeURIComponent(authCode || ""));
            socket.onclose = (event) => {
                console.log("WebSocket closed:", event);
                setTimeout(refresh, 1000);
            };
            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                socket.close();
            };
            socket.onopen = (event) => {
                console.log("WebSocket opened:", event);
                statusText.innerText = "Connected. Waiting for agent...";
            };
            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === "refresh" || message.type === "disconnect") refresh();
                else if (message.type === "ping") {}
                else if (message.type === "enable") {
                    audioEnabled = true;
                    statusText.innerText = "Speaking with agent...";
                } else if (message.type === "audio") {
                    voiceAgentNode.port.postMessage(atobInt16(message.data));
                } else {
                    console.warn("Unknown message type:", message);
                }
            };
        }

        selectMode('default');
    </script>
</body>

</html>
